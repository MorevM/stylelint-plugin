name: Docs preview

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deployment
      queue: max
    steps:
      - name: Check changed files
        if: github.event.action != 'closed'
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'src/rules/**/*.docs.md'
              - 'src/rules/*/*/*.ts'
              - 'src/modules/meta/**'
              - '*.md'
              - '.github/images/**'
              - '.github/actions/setup/**'
              - '.github/workflows/docs*.yaml'

      - name: Checkout the repository
        if: github.event.action == 'closed' || steps.changes.outputs.docs == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.action == 'closed' && 'master' || github.ref }}

      - name: Setup environment
        if: github.event.action != 'closed' && steps.changes.outputs.docs == 'true'
        uses: ./.github/actions/setup

      - name: Build docs
        if: github.event.action != 'closed' && steps.changes.outputs.docs == 'true'
        run: pnpm docs:build --base /stylelint-plugin/pr-preview/pr-${{ github.event.number }}/

      - name: Publish or remove preview
        if: github.event.action == 'closed' || steps.changes.outputs.docs == 'true'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
          source-dir: docs/.vitepress/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: morevm.github.io/stylelint-plugin
          qr-code: false
