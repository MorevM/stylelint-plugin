git:
  commitMessage: 'release: Release version ${version}'
  tagAnnotation: 'Release version ${version}'
  tagName: 'v${version}'

npm:
  publish: false

plugins:
  '@release-it/conventional-changelog':
    infile: CHANGELOG.md
    header: '# Changelog'
    preset:
      name: conventionalcommits
      types:
        - type: feat
          section: Features
        - type: fix
          section: Bug fixes
        - type: refactor
          section: Refactoring
        - type: test
          section: Tests
        - type: docs
          section: Documentation
        - type: ci
          section: CI improvements
        - type: chore
          section: Chores
        - type: release
          effect: hidden
        - type: revert
          effect: hidden
        - type: build
          effect: hidden
        - type: wip
          effect: hidden
        - type: nvm
          effect: hidden

hooks:
  before:init:
    - pnpm lint:fix
    - pnpm build
  after:init:
    - pnpm lint
    - pnpm test
