<svg xmlns="http://www.w3.org/2000/svg" width="688" height="336" viewBox="0 0 688 336">
	<title>Ordering a nested SCSS file</title>
	<desc>
		root.order places the whole .card rule before the top-level print media query.
		Inside .card, order places a screen media query before the hover state and title element.
	</desc>
	<style>
		svg {
			--surface: #fafafb;
			--edge: #d7d9df;
			--ink: #252831;
			--muted: #505662;
			--root: #5840a2;
			--root-fill: #f0ecfa;
			--family: #166458;
			--family-fill: #e8f4ef;
			font-family: system-ui, sans-serif;
			fill: var(--ink);
		}
		@media (prefers-color-scheme: dark) {
			svg {
				--surface: #202127;
				--edge: #42454f;
				--ink: #f2f1f6;
				--muted: #c2c3cf;
				--root: #c9b9ff;
				--root-fill: #332e44;
				--family: #92ddc9;
				--family-fill: #233a35;
			}
		}
		.scope-code { font-family: ui-monospace, monospace; }
	</style>
	<rect x=".5" y=".5" width="687" height="335" rx="14" fill="var(--surface)" stroke="var(--edge)"/>

	<g class="scope-code" font-size="26" font-weight="700">
		<text x="24" y="43" fill="var(--root)">root.order</text>
		<text x="352" y="43" fill="var(--family)">order</text>
	</g>
	<g font-size="18" fill="var(--muted)">
		<text x="24" y="69">Across the stylesheet</text>
		<text x="352" y="69">Inside the .card selector</text>
	</g>

	<g fill="var(--root-fill)">
		<rect x="46" y="90" width="618" height="165" rx="8"/>
		<rect x="46" y="273" width="618" height="40" rx="8"/>
	</g>
	<g stroke="var(--root)" stroke-width="2" fill="var(--surface)">
		<path d="M 28 110 V 293 M 28 110 h 12 M 28 293 h 12" fill="none"/>
		<circle cx="28" cy="110" r="4"/>
		<circle cx="28" cy="293" r="4"/>
	</g>
	<rect x="72" y="125" width="576" height="99" rx="5" fill="var(--family-fill)"/>
	<path d="M 83 135 h -4 v 79 h 4" stroke="var(--family)" stroke-width="2" fill="none"/>

	<g class="scope-code" font-size="21">
		<text x="60" y="117">.card {</text>
		<text x="94" y="151">@media screen {}</text>
		<text x="94" y="182">&amp;:hover {}</text>
		<text x="94" y="213">&amp;__title {}</text>
		<text x="60" y="246">}</text>
		<text x="60" y="301">@media print {}</text>
	</g>
	<g class="scope-code" font-size="16" font-weight="600" text-anchor="end">
		<g fill="var(--root)">
			<text x="632" y="116">rules</text>
			<text x="632" y="300">css:media</text>
		</g>
		<g fill="var(--family)">
			<text x="632" y="150">css:media</text>
			<text x="632" y="181">pseudo-classes</text>
			<text x="632" y="212">elements</text>
		</g>
	</g>
</svg>
